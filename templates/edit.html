<!DOCTYPE html>
<html lang="en">
{% include 'header.html' %}
<body>

{% include 'navbar.html' %}

<div class="container">
  <main>
    <div class="row g-5">

      <div class="col-md-7 col-lg-8">
        <h4 class="mb-3">Edit URL, {{ link.name }}</h4>
        <form action="/edit/{{ link.id }}" method="post" class="needs-validation" novalidate>
          <div class="row g-3">
            <div class="col-sm-6">
              <label for="link_name" class="form-label">Name</label>
              <input type="text" class="form-control" id="link_name" name="link_name" value="{{ link.name }}" required>
              <div class="invalid-feedback">
                Valid first name is required.
              </div>
            </div>

            <div class="col-sm-6">
              <label for="link_url" class="form-label">URL</label>
              <input type="text" class="form-control" id="link_url" name="link_url" value="{{ link.url }}" required>
              <div class="invalid-feedback">
                Valid last name is required.
              </div>
            </div>

          <hr class="my-4">
          <button class="w-100 btn btn-primary btn-lg" type="submit">Save</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

{% include 'footer.html' %}

</body>
</html>
