<!DOCTYPE html>
<html lang="en">
{% include 'header.html' %}
<body>

{% include 'navbar.html' %}

<div class="row">
    <div class="col-sm"></div>
    <div class="col-sm">
        <ul class="list-group list-group-flush" id="search-results">
            {% for link in links %}
                <li id="link" class="list-group-item lh-1"{% if loop.index == 20 %} hx-get="/links/1" hx-trigger="revealed" hx-swap="afterend"{% endif %}><a {% if link.rank < 1.1 %}class="link-danger" {% elif link.rank < 2.5 %}class="link-warning" {% endif %}href="/redirect/{{ link.id }}" target="_blank" data-bs-toggle="tooltip" data-bs-placement="left"
                       data-bs-delay="200" title="{{ link.url|truncate(255) }}">{{ link.name }}</a></li>
            {% endfor %}
        </ul>
    </div>
    <div class="col-sm"></div>
</div>

{% include 'footer.html' %}

</body>
</html>
