{% for link in links %}
<li id="links" class="list-group-item lh-1" {% if next_page and loop.index == 20 %} hx-get="/links/{{ next_page }}" hx-trigger="revealed" hx-swap="afterend" {% endif %}><a {% if link.rank < 1.1 %}class="link-danger" {% elif link.rank < 2.5 %}class="link-warning" {% endif %}href="/redirect/{{ link.id }}" target="_blank" data-bs-toggle="tooltip" data-bs-placement="left" data-bs-delay="200" title="{{ link.url }}">{{ link.name }}</a></li>
{% endfor %}
