name: Publish Container

on:
  push:
    branches:
      - main

jobs:
  # ── Step 1: read the version and decide whether to publish ──────────────────
  check-version:
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.version.outputs.is_stable }}
      version:   ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Only publish clean X.Y.Z releases — skip alpha (a), beta (b), and RC (rc)
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "✅ Stable release detected: $VERSION"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  Pre-release version '$VERSION' — skipping container publish."
          fi

  # ── Step 2: build multi-arch image and push to ghcr.io ──────────────────────
  build-and-push:
    needs: check-version
    if: needs.check-version.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/startpage
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
