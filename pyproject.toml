[project]
name = "startpage"
version = "1.2.2"
description = ""
authors = [{ name = "Brandon Leon", email = "brandonleon@pm.me" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "aiofiles>=0.8.0,<0.9.0",
    "fastapi>=0.86,<0.87",
    "jinja2>=3.0.3,<4.0.0",
    "pytest>=7.2.0,<8.0.0",
    "pytest-sugar>=0.9.5,<0.10.0",
    "python-dotenv>=0.19.2,<0.20.0",
    "python-multipart>=0.0.5,<0.0.6",
    "timeago>=1.0.15,<2.0.0",
    "timeflake>=0.4.2,<0.5.0",
    "tomlkit>=0.10.1,<0.11.0",
    "uvicorn>=0.17.5,<0.18.0",
    "uvloop>=0.17.0,<0.18.0",
    "uuid>=1.30,<2.0",
]

[dependency-groups]
dev = [
    "mypy>=0.941,<0.942",
]

[tool.setuptools]
packages = ["services"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
